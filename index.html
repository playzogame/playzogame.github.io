<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>Game Arcade - Free Online Games</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      padding-bottom: 2rem;
    }

    /* Responsive Header */
    header {
      background-color: #020617;
      padding: 0.85rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .logo {
      font-size: clamp(1.2rem, 3.5vw, 1.5rem);
      font-weight: 700;
      color: #38bdf8;
      text-decoration: none;
    }

    /* Container */
    .container {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 1.5rem 1rem;
    }

    .section-title {
      font-size: clamp(1.1rem, 3vw, 1.4rem);
      margin-bottom: 1rem;
      color: #e2e8f0;
      font-weight: 600;
    }

    /* Responsive Game Grid */
    .game-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 1rem;
    }

    /* Game Card */
    .game-card {
      background-color: #1e293b;
      border-radius: 12px;
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      border: 1px solid #334155;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .game-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
      border-color: #38bdf8;
    }

    .game-card:active {
      transform: scale(0.97);
    }

    .game-card img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      background-color: #000;
      display: block;
    }

    .game-info {
      padding: 0.65rem 0.85rem;
    }

    .game-info h3 {
      font-size: clamp(0.85rem, 2.5vw, 0.95rem);
      margin-bottom: 0.2rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .game-info span {
      font-size: clamp(0.7rem, 2vw, 0.8rem);
      color: #94a3b8;
    }

    /* Mobile Screen Adjustments */
    @media (max-width: 600px) {
      header {
        padding: 0.75rem 1rem;
      }
      .container {
        padding: 1rem 0.75rem;
      }
      /* Clean 2-column layout on phones */
      .game-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 0.75rem;
      }
      .game-info {
        padding: 0.5rem 0.6rem;
      }
    }
  </style>
</head>
<body>

  <header>
    <a href="#" class="logo">🎮 Web Arcade</a>
  </header>

  <main class="container">
    <h2 class="section-title">Popular Games</h2>

    <div class="game-grid">

      <a href="game.html" class="game-card">
        <img src="https://upload.wikimedia.org/wikipedia/commons/1/18/2048_logo.svg" alt="2048" loading="lazy" />
        <div class="game-info">
          <h3>2048</h3>
          <span>Puzzle</span>
        </div>
      </a>

      <a href="game.html" class="game-card">
        <img src="https://hextris.io/images/icons/apple-touch-icon-180x180.png" alt="Hextris" loading="lazy" />
        <div class="game-info">
          <h3>Hextris</h3>
          <span>Arcade</span>
        </div>
      </a>

      <a href="game.html" class="game-card">
        <img src="https://chromedino.com/assets/offline-sprite-2x.png" alt="Dino" loading="lazy" />
        <div class="game-info">
          <h3>Chrome Dino</h3>
          <span>Runner</span>
        </div>
      </a>

      <a href="game.html" class="game-card">
        <img src="https://via.placeholder.com/300x300.png?text=Flappy+Bird" alt="Flappy Bird" loading="lazy" />
        <div class="game-info">
          <h3>Flappy Bird</h3>
          <span>Arcade</span>
        </div>
      </a>

      <a href="game.html" class="game-card">
        <img src="https://via.placeholder.com/300x300.png?text=Pacman" alt="Pac-Man" loading="lazy" />
        <div class="game-info">
          <h3>Pac-Man</h3>
          <span>Classic</span>
        </div>
      </a>

      <a href="game.html" class="game-card">
        <img src="https://via.placeholder.com/300x300.png?text=Snake" alt="Snake" loading="lazy" />
        <div class="game-info">
          <h3>Snake Game</h3>
          <span>Retro</span>
        </div>
      </a>

    </div>
  </main>

</body>
</html>
